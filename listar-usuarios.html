<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Monteiro</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header>
        <h2>API Monteiro</h2>
        <ul>
            <li><a href="./index.html">Home</a></li>
            <li><a href="./cadastro.html">Cadastro</a></li>
        </ul>
    </header>

    <div class="campo-buscar" id="campo-buscar">
        <input 
            type="number" 
            placeholder="Busque um usuário pelo ID"
            id="input-pesquisa"    
        >
        <button class="btn-buscar" id="btn-buscar">Buscar</button>
    </div>
    
    <main>
        <!-- Lista de usuários enviadas pela API -->
    </main>
    <dialog class="modal-edicao" id="modal-edicao">

        <form class="form-modal" id="form-modal">

            <label for="nome-modal">Nome Completo</label>
            <input 
                type="text" 
                id="nome-modal" 
                name="nome"
            >

            <label for="email-modal">Email</label>
            <input 
                type="text" 
                id="email-modal"
                name="email"    
            >

            <label for="senha-modal">Senha</label>
            <input 
                type="text" 
                id="senha-modal"
                name="senha"    
            >

            <label for="cep-modal">CEP</label>
            <input 
                type="number"  
                id="cep-modal" 
                name="cep"
            >

            <label for="complemento-modal">Complemento</label>
            <input 
                type="text" 
                id="complemento-modal" 
                name="complemento"
            >

            <label for="numero-modal">Numero</label>
            <input 
                type="number" 
                id="numero-modal" 
                name="numero"
            >

            <button id="btn-salvar">Salvar</button>
            <button id="btn-cancelar">Cancelar</button>

        </form>

    </dialog>
</body>
<script src="./js/index.js"></script>
</html>
