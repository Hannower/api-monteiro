<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <h2>API Monteiro</h2>
        <ul>
            <li><a href="./index.html">Home</a></li>
            <li><a href="./cadastro.html">Cadastro</a></li>
        </ul>
    </header>

    <main>
        <form class="form-cadastro-produtos">

            <label for="produto">Produto</label>
            <input 
                type="text"
                name="produto"
                id="produto"
                class="produto"
                placeholder="Insira o nome do produto"
            >

            <label for="preco">Preço</label>
            <input 
                type="number"
                name="preco"
                id="preco"
                class="preco"
                placeholder="Insira o preco do produto"
            >

            <label for="estoque">Estoque</label>
            <input 
                type="number"
                name="estoque"
                id="estoque"
                class="estoque"
                placeholder="Insira o estoque do produto"
            >

            <label for="descricao">Descrição</label>
            <input 
                type="text"
                name="descricao"
                id="descricao"
                class="descricao"
                placeholder="Insira a descrição do produto"
            >

            <button class="btn-cadastrar-produto">Cadastrar</button>

        </form>
    </main>

</body>
<script src="./js/cadastro-produto.js"></script>
</html>
